[project]
name = "langjo-backend"
version = "0.1.0"
description = "FastAPI backend for the Langjo journaling app"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary",
    "SQLAlchemy",
    "python-dotenv",
    "alembic",
    "fastapi[standard]",
    "PyJWT",
    "sudachipy",
    "sudachidict_core",
]

[project.scripts]
langjo-migrate = "backend.scripts.alembic_cli:migrate"
langjo-upgrade = "backend.scripts.alembic_cli:upgrade"
langjo-downgrade = "backend.scripts.alembic_cli:downgrade"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]